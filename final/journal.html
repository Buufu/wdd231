<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Journal | Smart Forex Trading Hub</title>
  <meta name="description" content="Keep a personal trading journal for your Forex entries, exits, risk levels, and lessons learned.">
  <meta name="author" content="Andrew Ssebuufu">
  <meta property="og:title" content="Trading Journal | Smart Forex Trading Hub">
  <meta property="og:description" content="Track your Forex trades and notes in a simple personal journal built for learning and reflection.">
  <meta property="og:image" content="https://buufu.github.io/wdd231/final/images/favicon.svg">
  <meta property="og:url" content="https://buufu.github.io/wdd231/final/journal.html">
  <meta property="og:type" content="website">
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/normalize.css">
  <link rel="stylesheet" href="styles/small.css">
  <link rel="stylesheet" href="styles/final.css">
  <script src="scripts/navigation.js" defer></script>
  <script src="scripts/theme.js" defer></script>
  <script src="scripts/journal.js" defer></script>
</head>
<body>
  <header>
    <div class="brand">
      <img src="images/favicon.svg" alt="logo" width="48" height="48">
      <div>
        <p class="brand-name">Smart Forex Trading Hub</p>
        <p class="brand-tag">Trading Journal</p>
      </div>
    </div>
    <button id="theme-toggle" aria-label="Toggle theme">🌓</button>
  </header>

  <main>
    <section class="content-hero">
      <h1>Trading Journal</h1>
      <p>Record your trades and notes. Entries are stored locally in your browser.</p>
    </section>

    <section class="journal-form" aria-label="Add journal entry">
      <label>Pair<input id="j-pair" placeholder="EUR/USD"></label>
      <label>Entry<input id="j-entry" type="number" step="0.0001"></label>
      <label>Exit<input id="j-exit" type="number" step="0.0001"></label>
      <label>Stop Loss<input id="j-sl" type="number" step="0.0001"></label>
      <label>Take Profit<input id="j-tp" type="number" step="0.0001"></label>
      <label>Profit/Loss<input id="j-pl" type="number" step="0.01"></label>
      <label>Notes<textarea id="j-notes"></textarea></label>
      <button id="j-save">Save Entry</button>
    </section>

    <section class="journal-list">
      <h2>Your Entries</h2>
      <div id="entries"></div>
    </section>
  </main>

  <footer>
    <p><a href="index.html">Back to Home</a></p>
  </footer>
</body>
</html>
