<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#07203a"/>
      <stop offset="1" stop-color="#0b3d91"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#071026"/>
  <g transform="translate(20,20)">
    <rect width="560" height="320" rx="8" fill="#0b1220" stroke="#123"/>
    <!-- simple candlesticks -->
    <g fill="#16a34a" stroke="#093" stroke-width="1">
      <rect x="40" y="180" width="12" height="60"/>
      <rect x="80" y="160" width="12" height="80"/>
      <rect x="120" y="140" width="12" height="100"/>
      <rect x="160" y="155" width="12" height="85"/>
      <rect x="200" y="170" width="12" height="70"/>
    </g>
    <g fill="#ef4444" stroke="#b91c1c" stroke-width="1">
      <rect x="240" y="130" width="12" height="110"/>
      <rect x="280" y="150" width="12" height="90"/>
      <rect x="320" y="170" width="12" height="70"/>
    </g>
    <text x="280" y="300" fill="#9fb4d9" font-size="14" text-anchor="middle">EUR/USD — example chart</text>
  </g>
</svg>
